name: River C lower softer slower
on:
  push:
    paths:
      - .github/workflows/medeus-river-c-deep-slow.yml
      - scripts/medeus_river_c_render.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio renderer
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-numpy
      - name: Render user audition
        run: python3 scripts/medeus_river_c_render.py
      - name: Keep audio preview
        uses: actions/upload-artifact@v4
        with:
          name: medeus-river-c-soft-slow
          path: research/audio/river-audition-v2/*.mp3
      - name: Publish audition file to docs repo
        run: |
          git config user.name "MEDEUS Audio QA"
          git config user.email "actions@users.noreply.github.com"
          git add research/audio/river-audition-v2
          git commit -m "audio: River C lowered softened slowed preview [skip ci]" || exit 0
          git push
